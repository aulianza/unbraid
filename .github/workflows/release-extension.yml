name: Release extension

on:
  push:
    # Deliberately distinct from the CLI's `v[0-9]*`, so the two release
    # pipelines can never fire for each other's tags.
    tags: ['vscode-v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Never cache in a release build: a poisoned cache would end up inside
          # a published artifact.
          package-manager-cache: false

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm ci

      # The extension shares the library and the review reducer, so the whole
      # suite guards this release, not just the extension's own tests.
      - run: npm run typecheck
      - run: npm test

      - name: Build the extension
        working-directory: extension
        run: npx tsup

      # Refuse to publish a tag that disagrees with the manifest, which is the
      # easiest way to ship 0.1.2 labelled 0.1.3 and never notice.
      - name: Check the tag matches the manifest
        working-directory: extension
        run: |
          TAG="${GITHUB_REF_NAME#vscode-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      - name: Package
        working-directory: extension
        run: npx vsce package --no-dependencies --allow-missing-repository

      # Open VSX serves Cursor, Windsurf, VSCodium, and Gitpod. Skipped rather
      # than failed when no token is configured, so a fork can still build.
      - name: Publish to Open VSX
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping the Open VSX publish."
            exit 0
          fi
          npx ovsx publish "unbraid-vscode-${GITHUB_REF_NAME#vscode-v}.vsix"

      # VS Code itself reads only this registry, so without it most people have
      # to install the .vsix by hand.
      - name: Publish to the Visual Studio Marketplace
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; skipping the Marketplace publish."
            exit 0
          fi
          npx vsce publish --no-dependencies --packagePath \
            "unbraid-vscode-${GITHUB_REF_NAME#vscode-v}.vsix"

      # The .vsix is attached either way: it is how VS Code users install until
      # the Marketplace publish is configured.
      - name: Attach the build to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "extension/unbraid-vscode-${GITHUB_REF_NAME#vscode-v}.vsix" \
            --title "unbraid for VS Code ${GITHUB_REF_NAME#vscode-v}" \
            --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" \
                 "extension/unbraid-vscode-${GITHUB_REF_NAME#vscode-v}.vsix" --clobber
